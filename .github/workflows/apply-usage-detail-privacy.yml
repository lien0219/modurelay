name: Apply usage detail privacy

on:
  push:
    branches:
      - feature/usage-detail-privacy
    paths:
      - tools/apply_usage_detail_privacy.py
      - tools/fix_usage_detail_privacy_patch.py
      - .github/workflows/apply-usage-detail-privacy.yml
  pull_request:
    branches:
      - develop
    paths:
      - tools/apply_usage_detail_privacy.py
      - tools/fix_usage_detail_privacy_patch.py
      - .github/workflows/apply-usage-detail-privacy.yml

permissions:
  contents: write

concurrency:
  group: apply-usage-detail-privacy
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply guarded patch
        run: |
          set -o pipefail
          python3 tools/fix_usage_detail_privacy_patch.py
          python3 tools/apply_usage_detail_privacy.py 2>&1 | tee /tmp/usage-privacy-patch.log

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Format Go changes
        run: |
          gofmt -w \
            backend/internal/service/domain_constants.go \
            backend/internal/service/setting_parse.go \
            backend/internal/service/settings_view.go \
            backend/internal/service/setting_update.go \
            backend/internal/service/setting_public.go \
            backend/internal/handler/dto/settings.go \
            backend/internal/handler/dto/usage_visibility.go \
            backend/internal/handler/dto/usage_visibility_test.go \
            backend/internal/handler/admin/setting_handler_update.go \
            backend/internal/handler/admin/setting_handler.go \
            backend/internal/handler/setting_handler.go \
            backend/internal/handler/usage_handler.go

      - name: Test backend
        working-directory: backend
        run: |
          set -o pipefail
          go test ./internal/handler/dto ./internal/handler ./internal/service 2>&1 | tee /tmp/usage-privacy-backend.log

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        working-directory: frontend
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee /tmp/usage-privacy-typecheck.log

      - name: Test frontend
        working-directory: frontend
        run: |
          set -o pipefail
          pnpm test:run 2>&1 | tee /tmp/usage-privacy-frontend-tests.log

      - name: Build frontend
        working-directory: frontend
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/usage-privacy-build.log

      - name: Verify patch cleanliness
        run: git diff --check

      - name: Remove temporary patch machinery
        run: |
          rm -rf tools
          rm -f .github/workflows/apply-usage-detail-privacy.yml
          rm -f usage-privacy-failure.txt usage-privacy-*.log

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: control and redact user usage billing details"
          git push origin HEAD:feature/usage-detail-privacy

      - name: Persist failure diagnostics
        if: failure()
        run: |
          git reset --hard HEAD
          git clean -fd
          for f in /tmp/usage-privacy-*.log; do
            if [ -f "$f" ]; then cp "$f" .; fi
          done
          {
            echo "workflow failed at $(date -u +%FT%TZ)"
            echo "commit: $GITHUB_SHA"
          } > usage-privacy-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add usage-privacy-*.log usage-privacy-failure.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "ci: record usage privacy failure diagnostics"
            git push origin HEAD:feature/usage-detail-privacy
          fi

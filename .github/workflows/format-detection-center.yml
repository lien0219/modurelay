name: Format Detection Center

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/format-detection-center.yml

permissions:
  contents: write

jobs:
  gofmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: false
      - name: Format detection center Go files
        run: |
          gofmt -w             backend/internal/handler/admin/detection_center_*.go             backend/internal/server/routes/admin.go             backend/internal/server/middleware/audit_log.go
      - name: Commit formatting only
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             backend/internal/handler/admin/detection_center_*.go             backend/internal/server/routes/admin.go             backend/internal/server/middleware/audit_log.go
          git commit -m "chore(admin): gofmt detection center"
          git push origin HEAD:develop

name: Apply usage privacy API contracts

on:
  push:
    branches:
      - feature/usage-detail-privacy
    paths:
      - tools/apply_usage_privacy_contracts.py
      - .github/workflows/apply-usage-privacy-contracts.yml

permissions:
  contents: write

concurrency:
  group: apply-usage-privacy-contracts
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/usage-detail-privacy
          fetch-depth: 0

      - name: Apply guarded contract update
        run: python3 tools/apply_usage_privacy_contracts.py

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Format and test API contracts
        run: |
          gofmt -w backend/internal/server/api_contract_test.go
          cd backend
          go test -tags=unit ./internal/server -run TestAPIContracts -count=1

      - name: Verify patch cleanliness
        run: git diff --check

      - name: Remove temporary machinery
        run: |
          rm -f tools/apply_usage_privacy_contracts.py
          rm -f .github/workflows/apply-usage-privacy-contracts.yml

      - name: Commit verified contract update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: update admin settings API contracts"
          git push origin HEAD:feature/usage-detail-privacy

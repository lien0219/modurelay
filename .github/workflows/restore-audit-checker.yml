name: Restore audit checker

on:
  push:
    branches:
      - feature/usage-detail-privacy
    paths:
      - .github/workflows/restore-audit-checker.yml

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/usage-detail-privacy
          fetch-depth: 0

      - name: Restore exact file from develop
        run: |
          git fetch origin develop
          git checkout origin/develop -- tools/check_pnpm_audit_exceptions.py
          rm -f .github/workflows/restore-audit-checker.yml
          git diff --check

      - name: Commit restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore audit exception checker"
          git push origin HEAD:feature/usage-detail-privacy

name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: 'Version tag to create and release'
        required: true
        type: string
      commit_sha:
        description: 'Exact main commit already published as the production image'
        required: true
        type: string
      create_tag:
        description: 'Create the version tag when it does not exist'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (for example v0.3.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: read

concurrency:
  group: modurelay-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  PRODUCTION_IMAGE: ghcr.io/lien0219/modurelay

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit_sha || inputs.tag || github.ref }}

      - name: Validate release provenance
        id: release_meta
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EXPECTED_COMMIT: ${{ inputs.commit_sha }}
        run: |
          set -Eeuo pipefail

          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must match vMAJOR.MINOR.PATCH"
            exit 1
          fi

          version="${tag#v}"
          image_version="$(tr -d '[:space:]' < deploy/IMAGE_VERSION)"
          if [ "$version" != "$image_version" ]; then
            echo "::error::Tag $tag does not match deploy/IMAGE_VERSION ($image_version)"
            exit 1
          fi

          release_commit="$(git rev-parse HEAD)"
          if [ -n "$EXPECTED_COMMIT" ] && [ "$release_commit" != "$EXPECTED_COMMIT" ]; then
            echo "::error::Checked out commit $release_commit does not match requested commit $EXPECTED_COMMIT"
            exit 1
          fi

          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "::error::Release tag commit must be contained in origin/main"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify production image exists
        shell: bash
        run: |
          set -Eeuo pipefail
          image="${PRODUCTION_IMAGE}:main-v${{ steps.release_meta.outputs.version }}"
          docker pull "$image" >/dev/null
          image_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")"
          release_commit="${{ steps.release_meta.outputs.commit }}"
          if [ "$image_revision" != "$release_commit" ]; then
            echo "::error::Production image revision $image_revision does not match release commit $release_commit"
            exit 1
          fi
          echo "Verified $image at $release_commit"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Create release tag
        if: ${{ inputs.create_tag }}
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release_meta.outputs.commit }}
        run: |
          set -Eeuo pipefail

          if ! remote_refs="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"; then
            echo "::error::Could not verify release tag $RELEASE_TAG"
            exit 1
          fi

          if [ -n "$remote_refs" ]; then
            remote_commit="$(awk '$2 ~ /\^\{\}$/ { print $1; exit }' <<<"$remote_refs")"
            if [ -z "$remote_commit" ]; then
              remote_commit="$(awk 'NR == 1 { print $1 }' <<<"$remote_refs")"
            fi
            if [ "$remote_commit" != "$RELEASE_COMMIT" ]; then
              echo "::error::Release tag $RELEASE_TAG already points to $remote_commit instead of $RELEASE_COMMIT"
              exit 1
            fi
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            echo "Reusing $RELEASE_TAG at $RELEASE_COMMIT after a release-job retry"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a \
            -m "ModuRelay $RELEASE_TAG" \
            -m "Automated release from main commit $RELEASE_COMMIT." \
            "$RELEASE_TAG" "$RELEASE_COMMIT"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Verify release tag target
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release_meta.outputs.commit }}
        run: |
          set -Eeuo pipefail
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          if [ "$tag_commit" != "$RELEASE_COMMIT" ]; then
            echo "::error::Release tag $RELEASE_TAG points to $tag_commit instead of $RELEASE_COMMIT"
            exit 1
          fi
          echo "Verified $RELEASE_TAG at $tag_commit"

      - name: Read annotated tag message
        id: tag_message
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          set -Eeuo pipefail
          tag="$RELEASE_TAG"
          message="$(git tag -l --format='%(contents)' "$tag")"
          if [ -z "$message" ]; then
            message="ModuRelay $tag"
          fi
          delimiter="TAG_MESSAGE_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          {
            echo "message<<$delimiter"
            echo "$message"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_MESSAGE: ${{ steps.tag_message.outputs.message }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          PRODUCTION_IMAGE: ${{ env.PRODUCTION_IMAGE }}

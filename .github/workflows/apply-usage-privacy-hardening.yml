name: Apply usage privacy hardening

on:
  pull_request:
    branches:
      - develop
    paths:
      - tools/apply_usage_privacy_hardening.py
      - .github/workflows/apply-usage-privacy-hardening.yml

permissions:
  contents: write

concurrency:
  group: apply-usage-privacy-hardening-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply guarded hardening patch
        run: python3 tools/apply_usage_privacy_hardening.py

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Format and test backend
        run: |
          gofmt -w backend/internal/service/setting_public.go
          cd backend
          go test ./internal/handler/dto ./internal/handler ./internal/service

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Regenerate lockfile
        working-directory: frontend
        run: pnpm install --lockfile-only

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        working-directory: frontend
        run: pnpm typecheck

      - name: Test privacy frontend surfaces
        working-directory: frontend
        run: |
          pnpm exec vitest run \
            src/components/admin/usage/__tests__/UsageTable.spec.ts \
            src/components/admin/usage/__tests__/UsageTable.visibility.spec.ts \
            src/views/user/__tests__/UsageView.spec.ts \
            src/views/admin/__tests__/SettingsView.spec.ts \
            src/stores/__tests__/app.spec.ts

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Verify production dependency audit
        run: |
          cd frontend
          pnpm audit --prod --audit-level=high --json > audit.json || true
          cd ..
          python tools/check_pnpm_audit_exceptions.py \
            --audit frontend/audit.json \
            --exceptions .github/audit-exceptions.yml
          rm -f frontend/audit.json

      - name: Verify patch cleanliness
        run: git diff --check

      - name: Remove temporary machinery
        run: |
          rm -f tools/apply_usage_privacy_hardening.py
          rm -f .github/workflows/apply-usage-privacy-hardening.yml

      - name: Commit verified hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: harden usage billing privacy controls"
          git push origin HEAD:feature/usage-detail-privacy

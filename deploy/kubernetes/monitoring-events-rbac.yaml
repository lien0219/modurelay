# Optional read-only event/resource access in one namespace. Replace default and the
# serviceAccount name with the application's actual values before applying.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: modurelay-monitoring-events
  namespace: default
rules:
  - apiGroups: [""]
    resources: [events, pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: modurelay-monitoring-events
  namespace: default
subjects:
  - kind: ServiceAccount
    name: modurelay
    namespace: default
roleRef:
  kind: Role
  name: modurelay-monitoring-events
  apiGroup: rbac.authorization.k8s.io

services:
  postgres:
    image: postgres:18.1-alpine3.23
    environment:
      POSTGRES_DB: invoice_demo
      POSTGRES_USER: invoice_demo
      POSTGRES_PASSWORD: invoice_demo_local_only
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice_demo -d invoice_demo"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8.4-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
  redis-data:

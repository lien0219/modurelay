[SERVICE]
    Flush 1
    Log_Level info
    Parsers_File /fluent-bit/etc/modurelay-parsers.conf
    storage.path /state/buffer
    storage.backlog.mem_limit 16M
[INPUT]
    Name tail
    Tag modurelay
    Path /logs/*.log
    Parser modurelay_json
    DB /state/tail.db
    Read_from_Head true
    Refresh_Interval 2
    Rotate_Wait 30
    Skip_Long_Lines On
    Buffer_Max_Size 1M
    Mem_Buf_Limit 16M
    storage.type filesystem
[OUTPUT]
    Name loki
    Match modurelay
    Host ${LOKI_HOST}
    Port ${LOKI_PORT}
    Labels job=modurelay,service=$service,cluster=$cluster,namespace=$namespace
    Line_Format json
    Retry_Limit False
    storage.total_limit_size 256M

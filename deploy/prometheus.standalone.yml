# Optional Prometheus for Docker/Linux. Adapt the target to your network.
# Run Prometheus with --storage.tsdb.retention.time=30d and an explicit size cap.
global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/prometheus.monitoring.rules.yml
scrape_configs:
  - job_name: modurelay-instance
    metrics_path: /metrics/instance
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/modurelay-metrics-token
    static_configs:
      - targets: [modurelay:8080]
        labels:
          service: modurelay
          cluster: standalone
  - job_name: modurelay-cluster
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/modurelay-metrics-token
    static_configs:
      - targets: [modurelay:8080]
        labels:
          cluster: standalone

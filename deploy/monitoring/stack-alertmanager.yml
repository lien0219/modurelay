global:
  resolve_timeout: 2m
route:
  receiver: local-evidence
  group_by: [alertname, cluster, instance, job_name]
  group_wait: 5s
  group_interval: 15s
  repeat_interval: 5m
  routes:
    - matchers: ['alertname="ModuRelayMonitoringWatchdog"']
      receiver: local-evidence
      group_wait: 0s
      group_interval: 15s
      repeat_interval: 1m
receivers:
  - name: local-evidence
    webhook_configs:
      - url: http://watchdog-receiver:8080/alerts
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/receiver_token

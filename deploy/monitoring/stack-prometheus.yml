global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: local-monitoring
    replica: monitoring-1
rule_files:
  - /etc/prometheus/monitoring.rules.yml
  - /etc/prometheus/billing-observation.rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: thanos
    static_configs:
      - targets: [sidecar:10902, store:10902, compact:10902, query:10902]
  - job_name: modurelay-instance
    metrics_path: /metrics/instance
    authorization:
      type: Bearer
      credentials_file: /run/secrets/app_metrics_token
    file_sd_configs:
      - files: [/run/secrets/application-targets.json]
        refresh_interval: 30s

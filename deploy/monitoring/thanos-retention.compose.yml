# Optional isolated monitoring stack. Bootstrap secrets, then start with
# --profile local-object-store. For a cloud bucket, omit the profile and merge
# thanos-cloud.override.yml. Never run two compactors against the same bucket.
name: modurelay-monitoring
x-hardening: &hardening
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${MONITORING_RAW_RETENTION:-31d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-10GB}
      - --storage.tsdb.min-block-duration=2h
      - --storage.tsdb.max-block-duration=2h
      - --web.enable-admin-api
    ports: ["127.0.0.1:${MONITORING_PROMETHEUS_PORT:-19090}:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - prometheus-data:/prometheus
      - ./stack-prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus.monitoring.rules.yml:/etc/prometheus/monitoring.rules.yml:ro
      - ./billing-observation.rules.yml:/etc/prometheus/billing-observation.rules.yml:ro
    secrets:
      - app_metrics_token
      - source: application_targets
        target: application-targets.json
      - source: cluster_targets
        target: cluster-targets.json
    networks: [monitoring]
  sidecar:
    <<: *hardening
    image: quay.io/thanos/thanos:v0.42.4
    # Prometheus owns the shared TSDB as nobody; the shipper writes its state here.
    user: "65534:65534"
    command:
      - sidecar
      - --prometheus.url=http://prometheus:9090
      - --tsdb.path=/prometheus
      - --objstore.config-file=/run/secrets/object_store
      - --grpc-address=0.0.0.0:10901
      - --http-address=0.0.0.0:10902
    depends_on: [prometheus]
    volumes: ["prometheus-data:/prometheus"]
    secrets: [object_store]
    networks: [monitoring, object-store]
  store:
    <<: *hardening
    image: quay.io/thanos/thanos:v0.42.4
    depends_on:
      volume-init: {condition: service_completed_successfully}
    command:
      - store
      - --data-dir=/var/thanos/store
      - --objstore.config-file=/run/secrets/object_store
      - --grpc-address=0.0.0.0:10901
      - --http-address=0.0.0.0:10902
    volumes: ["store-data:/var/thanos/store"]
    secrets: [object_store]
    networks: [monitoring, object-store]
  query:
    <<: *hardening
    image: quay.io/thanos/thanos:v0.42.4
    command:
      - query
      - --http-address=0.0.0.0:10902
      - --query.replica-label=replica
      - --query.auto-downsampling
      - --endpoint=sidecar:10901
      - --endpoint=store:10901
    depends_on: [sidecar, store]
    ports: ["127.0.0.1:${MONITORING_QUERY_PORT:-10902}:10902"]
    networks: [monitoring]
  compact:
    <<: *hardening
    image: quay.io/thanos/thanos:v0.42.4
    depends_on:
      volume-init: {condition: service_completed_successfully}
    command:
      - compact
      - --data-dir=/var/thanos/compact
      - --objstore.config-file=/run/secrets/object_store
      - --http-address=0.0.0.0:10902
      - --wait
      - --wait-interval=5m
      - --retention.resolution-raw=${MONITORING_RAW_RETENTION:-31d}
      - --retention.resolution-5m=${MONITORING_5M_RETENTION:-90d}
      - --retention.resolution-1h=${MONITORING_1H_RETENTION:-365d}
    volumes: ["compact-data:/var/thanos/compact"]
    secrets: [object_store]
    networks: [monitoring, object-store]
  volume-init:
    image: python:3.13.8-alpine3.22
    user: "0:0"
    command: [python, -c, "import os; os.chown('/store', 1001, 1001); os.chown('/compact', 1001, 1001)"]
    volumes: ["store-data:/store", "compact-data:/compact"]
    network_mode: none
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN]
  minio:
    <<: *hardening
    profiles: [local-object-store]
    # The local S3-compatible fixture is isolated from host ports. Production
    # deployments should use the approved cloud object-store override.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets: [minio_root_user, minio_root_password]
    volumes: ["object-data:/data"]
    networks: [object-store]
  bucket-init:
    profiles: [local-object-store]
    image: python:3.13.8-alpine3.22
    depends_on: [minio]
    command: [python, /app/bucket_init.py]
    user: "65532:65532"
    read_only: true
    volumes: ["./bucket_init.py:/app/bucket_init.py:ro"]
    secrets: [minio_root_user, minio_root_password]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [object-store]
  alertmanager:
    <<: *hardening
    image: prom/alertmanager:v0.34.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager", "--cluster.listen-address="]
    volumes:
      - alertmanager-data:/alertmanager
      - ${MONITORING_ALERTMANAGER_CONFIG:-./stack-alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
    secrets: [receiver_token]
    ports: ["127.0.0.1:${MONITORING_ALERTMANAGER_PORT:-19093}:9093"]
    networks: [monitoring]
  watchdog-receiver:
    <<: *hardening
    build:
      context: .
      dockerfile: watchdog-receiver.Dockerfile
    image: modurelay-monitoring-receiver:1
    environment:
      WATCHDOG_TIMEOUT_SECONDS: ${WATCHDOG_TIMEOUT_SECONDS:-180}
    secrets: [receiver_token]
    volumes: ["receiver-data:/state"]
    ports: ["127.0.0.1:${MONITORING_RECEIVER_PORT:-19094}:8080"]
    read_only: true
    networks: [monitoring]
volumes:
  prometheus-data:
  store-data:
  compact-data:
  object-data:
  alertmanager-data:
  receiver-data:
networks:
  monitoring:
  object-store:
    internal: true
secrets:
  object_store:
    file: ${MONITORING_SECRETS_DIR:-./secrets}/object-store.yml
  app_metrics_token:
    file: ${MONITORING_SECRETS_DIR:-./secrets}/app-metrics-token
  application_targets:
    file: ${MONITORING_SECRETS_DIR:-./secrets}/application-targets.json
  cluster_targets:
    file: ${MONITORING_SECRETS_DIR:-./secrets}/cluster-targets.json
  minio_root_user:
    file: ${MONITORING_SECRETS_DIR:-./secrets}/minio-root-user
  minio_root_password:
    file: ${MONITORING_SECRETS_DIR:-./secrets}/minio-root-password
  receiver_token:
    file: ${MONITORING_SECRETS_DIR:-./secrets}/receiver-token

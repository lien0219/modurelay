version: 2

project_name: modurelay

before:
  hooks:
    - go mod download -C backend

builds:
  - id: modurelay
    dir: backend
    main: ./cmd/server
    # Keep the runtime filename compatible with existing service and entrypoint files.
    binary: sub2api
    flags:
      - -tags=embed
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.Commit}}
      - -X main.Date={{.Date}}
      - -X main.BuildType=release
      - -X main.DeploymentMode=binary

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE*
      - README*
      - deploy/*

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  disable: true

# Container images are intentionally not built here. Production images are
# published only by publish-main-image.yml to ghcr.io/lien0219/modurelay.

release:
  github:
    owner: "{{ .Env.GITHUB_REPO_OWNER }}"
    name: "{{ .Env.GITHUB_REPO_NAME }}"
  draft: false
  prerelease: auto
  name_template: "ModuRelay {{.Version}}"
  header: |
    > ModuRelay AI gateway release

    {{ .Env.TAG_MESSAGE }}

  footer: |
    ---

    ## Production image

    ```bash
    docker pull {{ .Env.PRODUCTION_IMAGE }}:main-v{{ .Version }}
    ```

    Deploy or roll back from the production host:

    ```bash
    ./deploy-main.sh {{ .Env.PRODUCTION_IMAGE }}:main-v{{ .Version }}
    ```

    Image rollback does not restore the database. Verify migration
    compatibility and keep a recoverable database backup before deployment.

    ## Standalone binaries

    Download the archive for the target platform from the assets below. A
    private repository requires `UPDATE_GITHUB_TOKEN` for in-app binary
    update and rollback.
